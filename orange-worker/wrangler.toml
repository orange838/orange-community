name = "orange-community-api"
main = "src/index.ts"
compatibility_date = "2026-09-12"
workers_dev = true

routes = [
  { pattern = "api.cslblog.dpdns.org/*", zone_name = "cslblog.dpdns.org" }
]

[[d1_databases]]
binding = "DB"
database_name = "orange-community"
database_id = "05800bf1-0e28-4678-9a85-e9d9eec28039"

# 保护账号标识及其他敏感值使用 Worker Secret 配置，不要写入仓库：
# `wrangler secret put ORANGE_PROTECTED_ADMIN_EMAIL`
# `wrangler secret put ORANGE_PROTECTED_ADMIN_USERNAME`
# `wrangler secret put SECRET_KEY`（JWT 签名密钥）

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true