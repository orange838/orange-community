name = "orange-community-api"
main = "src/index.ts"
compatibility_date = "2026-09-12"
workers_dev = true

routes = [
  { pattern = "api.cslblog.dpdns.org/*", zone_name = "cslblog.dpdns.org" }
]

[[d1_databases]]
binding = "DB"
database_name = "orange-community"
database_id = "05800bf1-0e28-4678-9a85-e9d9eec28039"

[vars]
PROTECTED_ADMIN_EMAIL = "3659793158@qq.com"
PROTECTED_ADMIN_USERNAME = "orange"

# SECRET_KEY（JWT 签名密钥）为敏感值，请勿写入本文件。
# 请用 `wrangler secret put SECRET_KEY` 单独配置；本地 .env 的 SECRET_KEY 建议保持一致。
